        "Qwen3_5MoeForCausalLM": "qwen3_coder",
        "Qwen3_5ForConditionalGeneration": "qwen3_coder",
        "Qwen3_5MoeForConditionalGeneration": "qwen3_coder",
        "GptOssForCausalLM": "gpt-oss"
      },
      "request_capabilities": {
        "openai_chat_completions": [
          "tool_choice",
          "parallel_tool_calls",
          "max_completion_tokens",
          "presence_penalty",
          "frequency_penalty",
          "response_format",
          "user",
          "max_tokens",
          "messages",
          "model",
          "n",
          "reasoning_effort",
          "seed",
          "stop",
          "stream",
          "stream_options",
          "temperature",
          "top_p",
          "tools"
        ]
      },
      "gpu_memory_utilization": {"minimum": 0.1, "maximum": 0.95},
      "gpu_policy": {
        "certified_gpu_counts": [1, 2, 4],
        "max_gpus_per_instance": "auto",
        "require_homogeneous_devices": true,
        "p2p_topology": "preferred"
      },
      "tp_policy": {
        "size_source": "selected_gpu_count",
        "model_partition_check": "runtime_adapter"
      },
      "context_policy": {
        "allowed_steps": [2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144],
        "default": 4096
      },
      "failure_signatures": {
        "out_of_memory": ["CUDA out of memory", "torch.OutOfMemoryError", "KV cache is needed, which is larger than the available KV cache memory", "Not enough memory. Please try to increase --mem-fraction-static."]
      },
      "metrics": {
        "runtime_ttft_seconds": {"source": "sglang:time_to_first_token_seconds", "type": "histogram"},
        "runtime_tpot_seconds": null,
        "runtime_e2e_latency_seconds": {"source": "sglang:e2e_request_latency_seconds", "type": "histogram"},
        "runtime_output_tokens_total": {"source": "sglang:generation_tokens_total", "type": "counter"},
        "runtime_requests_total": {"source": "sglang:num_requests_total", "type": "counter"},
        "runtime_requests_running": {"source": "sglang:num_running_reqs", "type": "gauge"},
        "runtime_requests_waiting": {"source": "sglang:num_queue_reqs", "type": "gauge"},
        "runtime_queue_time_seconds": {"source": "sglang:queue_time_seconds", "type": "histogram"},
        "runtime_kv_cache_usage_ratio": {"source": "sglang:token_usage", "type": "gauge"},
        "runtime_errors_total": null
      },
      "arguments": {
