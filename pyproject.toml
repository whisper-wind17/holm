[project]
name = "holm"
version = "0.1.0rc1"
description = "Private AI Workspace monorepo engineering root"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "grpcio-tools==1.83.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
  "uv_build==0.11.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/control_api",
  "apps/gateway",
  "apps/host_agent",
  "apps/workers/download",
  "apps/workers/instance",
  "apps/workers/ledger",
  "apps/workers/maintenance",
  "packages/common",
  "packages/contracts",
  "packages/domain",
  "packages/ledger",
  "packages/persistence",
  "packages/protocols",
  "packages/runtimes",
  "packages/security",
  "packages/telemetry",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
markers = [
  "perf: real-load performance measurements excluded from deterministic CI",
]

[tool.ruff]
# Protobuf output is checked byte-for-byte by M1-07A; formatting generated files
# would create drift. Keep the exclusion to the two generated Agent files only.
extend-exclude = [
  "packages/contracts/src/holm_contracts/agent/v1/agent_pb2.py",
  "packages/contracts/src/holm_contracts/agent/v1/agent_pb2_grpc.py",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.mypy]
# These two files are generated by pinned grpcio-tools and are checked for exact
# regeneration separately. Handwritten contracts remain under strict mypy.
exclude = [
  "^packages/contracts/src/holm_contracts/agent/v1/agent_pb2\\.py$",
  "^packages/contracts/src/holm_contracts/agent/v1/agent_pb2_grpc\\.py$",
]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

# grpcio does not publish PEP 561 metadata. Limit the missing-stub allowance to
# that third-party module; Host Agent code itself remains strict.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# nvidia-ml-py does not publish PEP 561 metadata. Keep the allowance on its
# pynvml import only; handwritten Host Agent discovery code remains strict.
[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

# Protoc constructs message classes dynamically, so mypy cannot discover their
# attributes from generated Python. Skip following only these two generated
# modules; the byte-regeneration gate remains authoritative for their contents.
[[tool.mypy.overrides]]
module = [
  "holm_contracts.agent.v1.agent_pb2",
  "holm_contracts.agent.v1.agent_pb2_grpc",
]
follow_imports = "skip"
