[project]
name = "holm-maintenance-worker"
version = "0.1.0rc1"
description = "Private AI Workspace backup retention worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "holm-common==0.1.0rc1",
  "holm-domain==0.1.0rc1",
  "holm-persistence==0.1.0rc1",
  "sqlalchemy==2.0.52",
]

[project.scripts]
holm-maintenance-worker = "holm_maintenance_worker.__main__:main"

[tool.uv.sources]
holm-common = { workspace = true }
holm-domain = { workspace = true }
holm-persistence = { workspace = true }

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"
