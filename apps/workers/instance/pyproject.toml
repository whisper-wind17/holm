[project]
name = "holm-instance-controller"
version = "0.1.0rc1"
description = "Private AI Workspace Model Instance lifecycle controller"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio==1.83.1",
  "holm-common==0.1.0rc1",
  "holm-contracts==0.1.0rc1",
  "holm-domain==0.1.0rc1",
  "holm-persistence==0.1.0rc1",
  "holm-runtimes==0.1.0rc1",
  "sqlalchemy==2.0.52",
]

[project.scripts]
holm-instance-controller = "holm_instance_controller.__main__:main"

[tool.uv.sources]
holm-common = { workspace = true }
holm-contracts = { workspace = true }
holm-domain = { workspace = true }
holm-persistence = { workspace = true }
holm-runtimes = { workspace = true }

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"
